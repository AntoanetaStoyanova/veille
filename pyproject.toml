[tool.ruff]
target-version = "py313"
fix = true
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tasks/__init__.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = [
    "--doctest-modules",
    "--cov=src/veille",
    "--cov-report=term-missing",
    "--cov-report=html",
]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]
skip_empty = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
exclude = ["tasks/", "docs/"]

[tool.commitizen]
# cz_customize : seul moyen de changer le parseur du changelog ; tous les types y vont,
# seuls feat, fix, refactor et perf changent la version.
name = "cz_customize"
version_provider = "uv"
tag_format = "v$version"
annotated_tag = true
major_version_zero = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
version_files = ["src/veille/__init__.py:__version__"]

[tool.commitizen.customize]
schema = "<type>(<portée>)!: <description>"
example = "feat: snapshots Parquet du catalogue"
schema_pattern = '^(bump|feat|fix|refactor|perf|docs|test|chore)(\([^()\r\n]+\))?!?: \S.*'
commit_parser = '^((?P<change_type>feat|fix|refactor|perf|docs|test|chore)(?:\((?P<scope>[^()\r\n]*)\))?(?P<breaking>!)?):\s(?P<message>.*)?'
changelog_pattern = '^(feat|fix|refactor|perf|docs|test|chore)(\(.+\))?!?:'
change_type_order = ["Nouveautés", "Corrections", "Réécritures", "Performances", "Documentation", "Tests", "Maintenance"]

[tool.commitizen.customize.change_type_map]
feat = "Nouveautés"
fix = "Corrections"
refactor = "Réécritures"
perf = "Performances"
docs = "Documentation"
test = "Tests"
chore = "Maintenance"

[dependency-groups]
